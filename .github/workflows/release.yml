name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: 'Release'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Determine release channel
        id: release_channel
        run: |
          package_version="$(node --print "require('./package.json').version")"

          if [[ "${package_version}" == *-* ]]; then
            echo 'npm_tag=next' >> "${GITHUB_OUTPUT}"
            echo 'is_prerelease=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'npm_tag=latest' >> "${GITHUB_OUTPUT}"
            echo 'is_prerelease=false' >> "${GITHUB_OUTPUT}"
          fi

      - run: yarn install --immutable
      - run: yarn build

      - name: Dry-run npm publish
        run: npm publish --dry-run --provenance --access public --tag "${{ steps.release_channel.outputs.npm_tag }}"

      - name: Publish package
        run: npm publish --provenance --access public --tag "${{ steps.release_channel.outputs.npm_tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.release_channel.outputs.is_prerelease }}" == 'true' ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
